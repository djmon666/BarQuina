{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Usuaris de terminal</h1>
    <form class="d-flex gap-2" method="post">
        <input class="form-control" name="name" placeholder="Nom del personal" required>
        <button class="btn btn-primary" type="submit">Afegir</button>
    </form>
</div>
<div class="table-responsive">
<table class="table table-striped">
    <thead>
        <tr><th>Nom</th><th>Actiu</th><th></th></tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.name }}</td>
            <td>
                {% if user.is_active %}
                <span class="badge bg-success">Sí</span>
                {% else %}
                <span class="badge bg-secondary">No</span>
                {% endif %}
            </td>
            <td>
                <form method="post" action="{{ url_for('users.toggle_user', user_id=user.id) }}">
                    <button class="btn btn-sm btn-outline-secondary">Canvia estat</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="3">Encara no hi ha personal registrat.</td></tr>
        {% endfor %}
    </tbody>
</table>
</div>
{% endblock %}
